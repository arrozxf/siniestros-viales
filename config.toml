# Tema del dashboard: azul de la paleta en vez del rojo por defecto de Streamlit, en modo claro y oscuro.
# El modo lo elige el visor (configuracion del sistema o menu de la esquina superior derecha).
[theme.light]
primaryColor = "#2a78d6"

[theme.dark]
primaryColor = "#3987e5"

[browser]
gatherUsageStats = false
